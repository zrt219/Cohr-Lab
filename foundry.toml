[profile.default]
src        = "src"
out        = "out"
libs       = ["lib"]
test       = "test"
script     = "script"
solc       = "0.8.24"
optimizer  = true
optimizer_runs = 200
verbosity  = 2

[profile.default.fuzz]
runs = 512
seed = "0xdeadbeef"

[profile.default.invariant]
runs   = 128
depth  = 15

[fmt]
line_length    = 100
tab_width      = 4
bracket_spacing = true
